name: Bug report
description: Report a gameplay, connection, crash, or rendering problem.
title: "[Bug] "
body:
  - type: input
    id: mod_version
    attributes:
      label: Multibonk release
      placeholder: "v0.2.5 / protocol 111"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Game, MelonLoader and Windows versions
      placeholder: "MegaBonk 1.0.69, MelonLoader 0.7.3, Windows 11"
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Where does the problem happen?
      options:
        - Host
        - Client
        - Both
        - Dedicated authority
        - Not sure
    validations:
      required: true
  - type: input
    id: party
    attributes:
      label: Player count and connection
      placeholder: "2 players on LAN / internet; list any other mods"
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the character, skin, weapon or item involved when relevant.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and screenshots
      description: "Attach host/client MelonLoader/Latest.log and screenshots if available. Remove personal information before posting."
